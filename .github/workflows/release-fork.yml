name: release fork

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, without v prefix
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Verify provider safety
        working-directory: packages/core
        run: bun test test/models.test.ts test/catalog.test.ts test/config/config.test.ts

      - name: Build CLI artifacts
        working-directory: packages/opencode
        run: bun run script/build.ts
        env:
          OPENCODE_VERSION: ${{ inputs.version }}
          OPENCODE_CHANNEL: internal

      - name: Archive CLI artifacts
        run: |
          for directory in packages/opencode/dist/*; do
            name="${directory##*/}"
            tar -C packages/opencode/dist -czf "$name.tar.gz" "$name"
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "v$VERSION" opencode-*.tar.gz --generate-notes --title "v$VERSION"
