name: sync upstream

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Upstream branch or tag to merge
        required: true
        default: dev
        type: string
  schedule:
    - cron: "0 7 * * 1"

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork baseline
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: dev
          fetch-depth: 0

      - name: Merge upstream changes
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPSTREAM_REF: ${{ inputs.ref || 'dev' }}
        run: |
          if gh pr list --base dev --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("sync-upstream-"))] | length > 0' | grep -qx true; then
            echo "An upstream sync pull request is already open."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git remote add upstream https://github.com/anomalyco/opencode.git
          git fetch upstream "$UPSTREAM_REF"
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Upstream $UPSTREAM_REF has no changes to import."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="sync-upstream-$(date -u +%Y%m%d%H%M%S)"
          git config user.name "fork sync bot"
          git config user.email "actions@github.com"
          git switch -c "$branch"
          git merge --no-edit FETCH_HEAD
          git push origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Create review pull request
        if: steps.sync.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ steps.sync.outputs.branch }}
          UPSTREAM_REF: ${{ inputs.ref }}
        run: >-
          gh pr create --base dev --head "$BRANCH" --title "chore: sync upstream $UPSTREAM_REF"
          --body "Imports upstream $UPSTREAM_REF for review. Fork safety checks must pass before merge."
