name: fork safety

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Typecheck core
        working-directory: packages/core
        run: bun typecheck

      - name: Verify provider safety
        working-directory: packages/core
        run: bun test test/models.test.ts test/catalog.test.ts test/config/config.test.ts

      - name: Typecheck CLI
        working-directory: packages/opencode
        run: bun typecheck
